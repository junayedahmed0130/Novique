<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVIQUE // Secure Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="components.js"></script>
  <script type="text/babel">
    const navigate = (page) => window.location.href = page + '.html';

    function LoginPage() {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');

      const handleLogin = (e) => {
        e.preventDefault();
        navigate('loading');
      };

      return (
        <>
          <TargetingCursor />
          <Starfield />
          <div className="nebula-overlay" />
          <div className="scanlines" />
          
          <div className="app-container" style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <div style={{ width: '100%', maxWidth: '500px', padding: '60px 40px', background: 'var(--glass)', backdropFilter: 'blur(20px)', border: '1px solid var(--glass-border)', borderRadius: '20px' }}>
              <div style={{ textAlign: 'center', marginBottom: '40px' }}>
                <div style={{ fontFamily: 'var(--font-mono)', fontSize: '12px', color: 'var(--neon-cyan)', letterSpacing: '4px', marginBottom: '15px' }}>SECURE TRANSMISSION</div>
                <h1 style={{ fontSize: '32px', fontWeight: '700', letterSpacing: '2px', color: '#fff' }}>IDENTITY VERIFICATION</h1>
              </div>

              <form onSubmit={handleLogin}>
                <div style={{ marginBottom: '25px' }}>
                  <label style={{ display: 'block', fontFamily: 'var(--font-mono)', fontSize: '11px', color: 'var(--text-muted)', letterSpacing: '2px', marginBottom: '10px' }}>OPERATOR ID</label>
                  <input 
                    type="text" 
                    value={username}
                    onChange={(e) => setUsername(e.target.value)}
                    style={{ width: '100%', padding: '14px 20px', background: 'rgba(0,0,0,0.3)', border: '1px solid var(--glass-border)', borderRadius: '6px', color: '#fff', fontFamily: 'var(--font-mono)', fontSize: '14px', outline: 'none' }}
                    placeholder="Enter operator credentials"
                    required
                  />
                </div>

                <div style={{ marginBottom: '35px' }}>
                  <label style={{ display: 'block', fontFamily: 'var(--font-mono)', fontSize: '11px', color: 'var(--text-muted)', letterSpacing: '2px', marginBottom: '10px' }}>ACCESS CODE</label>
                  <input 
                    type="password" 
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    style={{ width: '100%', padding: '14px 20px', background: 'rgba(0,0,0,0.3)', border: '1px solid var(--glass-border)', borderRadius: '6px', color: '#fff', fontFamily: 'var(--font-mono)', fontSize: '14px', outline: 'none' }}
                    placeholder="Enter access code"
                    required
                  />
                </div>

                <button type="submit" className="btn btn-primary" style={{ width: '100%' }}>
                  AUTHENTICATE
                </button>
              </form>

              <div style={{ textAlign: 'center', marginTop: '30px', fontFamily: 'var(--font-mono)', fontSize: '11px', color: 'var(--text-muted)' }}>
                <span onClick={() => navigate('landing')} style={{ cursor: 'pointer', color: 'var(--neon-cyan)' }}>Return to Base</span>
              </div>
            </div>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<LoginPage />);
  </script>
</body>
</html>
