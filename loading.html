<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVIQUE // Loading</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="components.js"></script>
  <script type="text/babel">
    const navigate = (page) => window.location.href = page + '.html';

    function LoadingPage() {
      const [progress, setProgress] = useState(0);

      useEffect(() => {
        const interval = setInterval(() => {
          setProgress(prev => {
            if (prev >= 100) {
              clearInterval(interval);
              setTimeout(() => navigate('confirmed'), 500);
              return 100;
            }
            return prev + Math.random() * 3;
          });
        }, 100);

        return () => clearInterval(interval);
      }, []);

      return (
        <>
          <TargetingCursor />
          <Starfield />
          <div className="nebula-overlay" />
          <div className="scanlines" />
          
          <div className="app-container" style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
            <div style={{ width: '100%', maxWidth: '600px', textAlign: 'center' }}>
              <div style={{ fontFamily: 'var(--font-mono)', fontSize: '12px', color: 'var(--neon-cyan)', letterSpacing: '4px', marginBottom: '30px' }}>
                INITIALIZING WARP DRIVE
              </div>

              <div style={{ position: 'relative', width: '100%', height: '4px', background: 'var(--glass-border)', borderRadius: '2px', overflow: 'hidden', marginBottom: '20px' }}>
                <div style={{ position: 'absolute', top: 0, left: 0, height: '100%', width: `${progress}%`, background: 'linear-gradient(90deg, var(--neon-cyan), var(--neon-pink))', transition: 'width 0.3s', boxShadow: '0 0 10px var(--neon-cyan)' }}></div>
              </div>

              <div style={{ fontFamily: 'var(--font-mono)', fontSize: '48px', fontWeight: '700', color: '#fff', marginBottom: '15px' }}>
                {Math.floor(progress)}%
              </div>

              <div style={{ fontFamily: 'var(--font-mono)', fontSize: '12px', color: 'var(--text-muted)', letterSpacing: '2px' }}>
                {progress < 30 && 'CALIBRATING QUANTUM ARRAY...'}
                {progress >= 30 && progress < 60 && 'MAPPING STELLAR COORDINATES...'}
                {progress >= 60 && progress < 90 && 'ENGAGING WARP DRIVE...'}
                {progress >= 90 && 'FINALIZING TRAJECTORY...'}
              </div>
            </div>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<LoadingPage />);
  </script>
</body>
</html>
